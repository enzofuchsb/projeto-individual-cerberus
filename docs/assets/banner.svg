<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420">
  <style>
    @keyframes piscar { 0%, 90%, 100% { opacity: 1; } 94% { opacity: 0.2; } }
    .olhos { animation: piscar 5s infinite; }
    .olhos.b { animation-delay: 1.6s; }
    .olhos.c { animation-delay: 3.1s; }
    @keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .borda { transform-origin: 280px 280px; animation: girar 60s linear infinite; }
    @keyframes surgir { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .texto { animation: surgir 1.2s ease-out both; }
    .texto.b { animation-delay: 0.3s; }
    .texto.c { animation-delay: 0.6s; }
  </style>
  <defs>
    <g id="cabeca">
