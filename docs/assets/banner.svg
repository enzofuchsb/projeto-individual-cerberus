      <path d="M-40 30 L40 30 Q34 76 0 84 Q-34 76 -40 30 Z" fill="#e8742a"/>
      <path d="M-22 52 Q0 44 22 52 Q16 72 0 76 Q-16 72 -22 52 Z" fill="#b23a1a"/>
      <path d="M-36 30 L-32 44 L-28 31 L-23 54 L-18 31 L-12 42 L-6 31 L0 40 L6 31 L12 42 L18 31 L23 54 L28 31 L32 44 L36 30 Z" fill="#f3ecdf"/>
      <path d="M-28 66 L-23 52 L-18 70 L-10 74 L-6 62 L-2 76 L2 76 L6 62 L10 74 L18 70 L23 52 L28 66 Q0 90 -28 66 Z" fill="#f3ecdf"/>
      <path d="M-32 0 Q0 -10 32 0 L34 30 Q16 36 0 32 Q-16 36 -34 30 Z" fill="#232327"/>
      <path d="M-15 2 Q0 -6 15 2 Q13 15 0 17 Q-13 15 -15 2 Z" fill="#050505"/>
      <path d="M-52 -34 L-12 -18" stroke="#3b3b42" stroke-width="6" stroke-linecap="round"/>
      <path d="M52 -34 L12 -18" stroke="#3b3b42" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="olhos">
      <path d="M-46 -22 L-14 -13 Q-18 -2 -30 -3 Q-42 -6 -46 -22 Z" fill="#f2b632"/>
      <path d="M46 -22 L14 -13 Q18 -2 30 -3 Q42 -6 46 -22 Z" fill="#f2b632"/>
      <ellipse cx="-27" cy="-10" rx="3.5" ry="5" fill="#050505"/>
      <ellipse cx="27" cy="-10" rx="3.5" ry="5" fill="#050505"/>
    </g>
  </defs>

  <rect width="1200" height="420" fill="#121417"/>

  <!-- texto -->
  <g font-family="Cinzel, Georgia, 'Times New Roman', serif">
    <text class="texto" x="70" y="140" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" letter-spacing="4" fill="#f2b632">GUARDIÃO DOS PORTÕES · GUIA DOS MITOS</text>
    <text class="texto b" x="66" y="228" font-size="84" font-weight="bold" letter-spacing="10" fill="#f4ece0">CERBERUS</text>
    <text class="texto c" x="70" y="282" font-size="24" fill="#b9b2a7">A mitologia grega, contada pelo</text>
    <text class="texto c" x="70" y="316" font-size="24" fill="#b9b2a7">guardião do Submundo.</text>
  </g>

  <!-- Cerberus no disco terracota (figura negra) -->
  <g transform="translate(760 20) scale(0.68)">
    <circle cx="280" cy="280" r="268" fill="#c8693a"/>
    <circle cx="280" cy="280" r="250" fill="none" stroke="#121417" stroke-width="3"/>
    <circle class="borda" cx="280" cy="280" r="238" fill="none" stroke="#121417" stroke-width="10" stroke-dasharray="12 10"/>
    <circle cx="280" cy="280" r="226" fill="none" stroke="#121417" stroke-width="3"/>
