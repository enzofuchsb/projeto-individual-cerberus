    <ellipse cx="354" cy="494" rx="34" ry="13" fill="#17171a"/>
    <path d="M118 262 L196 232 L252 328 L162 340 Z" fill="#141416"/>
    <path d="M442 262 L364 232 L308 328 L398 340 Z" fill="#141416"/>
    <path d="M236 196 L324 196 L334 328 L226 328 Z" fill="#141416"/>
    <g transform="translate(150 262) rotate(-14) scale(0.92)"><use xlink:href="#cabeca" href="#cabeca"/><use xlink:href="#olhos" href="#olhos" class="olhos"/></g>
    <g transform="translate(410 262) rotate(14) scale(0.92)"><use xlink:href="#cabeca" href="#cabeca"/><use xlink:href="#olhos" href="#olhos" class="olhos c"/></g>
    <g transform="translate(280 196) scale(1.06)"><use xlink:href="#cabeca" href="#cabeca"/><use xlink:href="#olhos" href="#olhos" class="olhos b"/></g>
  </g>

  <!-- faixa grega -->
  <pattern id="faixa" width="20" height="14" patternUnits="userSpaceOnUse">
    <rect width="10" height="14" fill="#c8693a"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="20 0" dur="2s" repeatCount="indefinite"/>
  </pattern>
  <rect y="406" width="1200" height="14" fill="url(#faixa)"/>
</svg>
