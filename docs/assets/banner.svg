<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <radialGradient id="fogo" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#8b0000" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#3a0000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="titulo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#7a0000"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" fill="#050505"/>
  <rect width="1200" height="380" fill="url(#fogo)">
    <animate attributeName="opacity" values="0.7;1;0.8;1;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- brasas subindo -->
  <g fill="#ff2a2a" filter="url(#brilho)">
    <circle cx="120" cy="400" r="2"><animate attributeName="cy" from="400" to="-20" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="400" r="1.5"><animate attributeName="cy" from="400" to="-20" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="400" r="2.5"><animate attributeName="cy" from="400" to="-20" dur="6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="400" r="2"><animate attributeName="cy" from="400" to="-20" dur="8s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="400" r="1.5"><animate attributeName="cy" from="400" to="-20" dur="7.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="400" r="2.5"><animate attributeName="cy" from="400" to="-20" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- uma brasa verde, rara -->
  <circle cx="660" cy="400" r="2" fill="#2bff6a" filter="url(#brilho)">
    <animate attributeName="cy" from="400" to="-20" dur="14s" begin="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="14s" begin="5s" repeatCount="indefinite"/>
  </circle>

  <!-- três cabeças: olhos na escuridão -->
  <g filter="url(#brilho)">
    <g fill="#ff1a1a">
      <ellipse cx="420" cy="95" rx="9" ry="4"/><ellipse cx="460" cy="95" rx="9" ry="4"/>
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1" dur="5s" repeatCount="indefinite"/>
    </g>
    <g fill="#ff1a1a">
      <ellipse cx="740" cy="95" rx="9" ry="4"/><ellipse cx="780" cy="95" rx="9" ry="4"/>
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.6;0.63;0.66;1" dur="6s" repeatCount="indefinite"/>
    </g>
    <g fill="#ff1a1a">
      <ellipse cx="580" cy="70" rx="11" ry="5"/><ellipse cx="620" cy="70" rx="11" ry="5"/>
      <animate attributeName="fill" values="#ff1a1a;#ff1a1a;#2bff6a;#ff1a1a" keyTimes="0;0.85;0.9;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.4;0.43;0.46;1" dur="7s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="600" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="96" font-weight="bold" letter-spacing="18" fill="url(#titulo)" filter="url(#brilho)">CERBERUS
    <animate attributeName="opacity" values="1;0.85;1;0.95;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="8" fill="#bdbdbd">O GUARDIÃO DOS MITOS GREGOS</text>
  <line x1="420" y1="305" x2="780" y2="305" stroke="#8b0000" stroke-width="1">
    <animate attributeName="x1" values="600;420" dur="1.5s" fill="freeze"/>
    <animate attributeName="x2" values="600;780" dur="1.5s" fill="freeze"/>
  </line>
</svg>
