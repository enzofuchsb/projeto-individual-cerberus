<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40">
  <defs>
    <linearGradient id="linha" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#ff1a1a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="19" width="1000" height="2" fill="url(#linha)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(600 20) rotate(45)">
    <rect x="-7" y="-7" width="14" height="14" fill="#050505" stroke="#ff1a1a" stroke-width="2">
      <animate attributeName="stroke" values="#ff1a1a;#ff1a1a;#2bff6a;#ff1a1a" keyTimes="0;0.8;0.88;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="560" cy="20" r="3" fill="#ff1a1a"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="20" r="3" fill="#ff1a1a"><animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>
